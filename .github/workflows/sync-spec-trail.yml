name: Sync SpecTrail

on:
  push:
    branches: [main]
    paths:
      - .agents/skills/spec-trail/**
      - .github/workflows/sync-spec-trail.yml
      - scripts/sync-spec-trail.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spec-trail-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out latest source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: source
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Check out distribution
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: iTgo-lyq/spec-trail
          ref: main
          path: distribution
          ssh-key: ${{ secrets.SPEC_TRAIL_SYNC_SSH_KEY }}

      - name: Publish committed skill
        run: bash source/scripts/sync-spec-trail.sh "$GITHUB_WORKSPACE/source" "$GITHUB_WORKSPACE/distribution"
