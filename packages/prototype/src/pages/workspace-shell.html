<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>OpenFolio · 页面外壳</title><style>{{include:../shared/style.css}}</style></head>
<body>
{{include:../shared/icons.html}}
<template id="module-navigation"><nav class="module-nav" aria-label="模块导航">
<a href="#specs" data-module="specs" aria-label="Specs" aria-current="page"><svg class="icon" aria-hidden="true"><use href="#icon-specs"></use></svg><span>Specs</span></a>
<a href="#changes" data-module="changes" aria-label="Changes"><svg class="icon" aria-hidden="true"><use href="#icon-changes"></use></svg><span>Changes</span></a>
<a href="#prototypes" data-module="prototypes" aria-label="原型"><svg class="icon" aria-hidden="true"><use href="#icon-prototypes"></use></svg><span>原型</span></a>
</nav></template>
<div class="app-shell">
<aside class="module-rail">
<button class="shell-brand" aria-label="收起侧栏" aria-expanded="true"><img src="{{data:../assets/mark.png}}" alt="OpenFolio"><span class="restore-handle"></span></button>
<div data-navigation></div>
<button class="rail-footer" aria-label="工作台配置" data-settings><svg class="icon" aria-hidden="true"><use href="#icon-settings"></use></svg></button>
</aside>
<main class="workspace">
<header class="workspace-header">
<div class="header-context">
<label class="project-select"><span class="project-monogram">O</span><select aria-label="当前项目"><option>OpenFolio</option></select></label>
<svg class="icon header-chevron" aria-hidden="true"><use href="#icon-chevron"></use></svg><span class="header-module">Specs</span><span class="read-only">只读</span>
</div>
<div class="header-actions"><details class="header-source"><summary aria-label="查看读取状态"><svg class="icon" aria-hidden="true"><use href="#icon-branch"></use></svg><span class="header-source-label" id="source-label">main</span></summary><div class="header-source-details"><strong>读取来源</strong><span id="source">main · 守护分支</span><span>页面外壳预览</span></div></details>
<button class="icon-button settings-mobile-trigger" aria-label="工作台配置" data-settings><svg class="icon" aria-hidden="true"><use href="#icon-settings"></use></svg></button>
<button class="icon-button" id="refresh" aria-label="刷新中心仓库"><svg class="icon" aria-hidden="true"><use href="#icon-refresh"></use></svg></button>
</div>
</header>
<section class="shell-content" aria-labelledby="canvas-title"><div class="content-outline"><h1 id="canvas-title">Specs 内容区</h1><p>保留页面结构，业务内容后续补充</p></div></section>
</main>
</div>
<div class="mobile-navigation" data-navigation></div>
<div class="feedback" role="status" aria-live="polite"></div>
<script>
const $ = (selector) => document.querySelector(selector);
const labels = { specs: 'Specs', changes: 'Changes', prototypes: '原型' };
const sources = { specs: 'main · 守护分支', changes: '全部已推送分支 / 各 Change 主来源', prototypes: 'main / 当前页面' };
document.querySelectorAll('[data-navigation]').forEach(target => target.append($('#module-navigation').content.cloneNode(true)));
function render() {
 const id = Object.hasOwn(labels, location.hash.slice(1)) ? location.hash.slice(1) : 'specs';
 $('.header-module').textContent = labels[id];
 $('#canvas-title').textContent = labels[id] + ' 内容区';
 $('#source').textContent = sources[id];
 $('#source-label').textContent = id === 'changes' ? '全部分支' : 'main';
 document.querySelectorAll('[data-module]').forEach(link => {
  if (link.dataset.module === id) link.setAttribute('aria-current', 'page');
  else link.removeAttribute('aria-current');
 });
}
window.addEventListener('hashchange', render);
render();
$('.shell-brand').onclick = () => {
 const closed = $('.app-shell').classList.toggle('rail-collapsed');
 $('.shell-brand').setAttribute('aria-label', closed ? '展开侧栏' : '收起侧栏');
 $('.shell-brand').setAttribute('aria-expanded', String(!closed));
};
let feedbackTimer;
function feedback(text) {
 clearTimeout(feedbackTimer);
 $('.feedback').textContent = text;
 feedbackTimer = setTimeout(() => $('.feedback').textContent = '', 2400);
}
document.querySelectorAll('[data-settings]').forEach(button => button.onclick = () => feedback('工作台配置入口 · 当前为外壳预览'));
$('#refresh').onclick = () => feedback('当前为页面外壳预览');
</script>
</body></html>
