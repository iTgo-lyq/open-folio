<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>设备选择 · 局部组件样例</title><style>{{include:../shared/style.css}}</style></head><body class="component"><section class="panel"><p class="eyebrow">COMPONENT STUDY / 640 × 320</p><h2>为不同屏幕，留出合适的空间。</h2><div class="toolbar" aria-label="样例设备选择"><button type="button" aria-pressed="true" data-size="1440 × 900">PC Web</button><button type="button" aria-pressed="false" data-size="834 × 1194">iPad</button><button type="button" aria-pressed="false" data-size="390 × 844">移动设备</button></div><output aria-live="polite">PC Web · 1440 × 900 CSS px</output></section><p class="foot">局部组件设计样例 · 按钮只切换示意文字，外层画布保持 640 × 320。</p><script type="module">document.querySelectorAll('[data-size]').forEach(button=>button.onclick=()=>{document.querySelectorAll('[data-size]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));document.querySelector('output').textContent=button.textContent+' · '+button.dataset.size+' CSS px';});</script></body></html>
