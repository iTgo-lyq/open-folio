<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenFolio · Change 分享模式原型</title>
<style>{{include:../shared/style.css}}
{{include:../shared/change-sharing.css}}</style>
</head>
<body>
<details class="review-tools">
  <summary>设计预览 · 示例数据 <span>原型设置</span></summary>
  <div class="review-strip" aria-label="原型评审工具">
  <label>视角 <select id="perspective"><option value="reader">接收者</option><option value="owner">分享者</option></select></label>
  <label>场景 <select id="scene"><option value="ready">正常阅读</option><option value="new">尚未分享</option><option value="revoked">已停止分享</option><option value="unavailable">来源不可用</option><option value="offline">同步失败</option><option value="loading">正在读取</option></select></label>
  <button id="simulate-update">模拟新内容推送</button>
  </div>
</details>
<div class="share-shell">
  <header class="share-topbar">
    <div class="brand"><img src="{{data:../assets/mark.png}}" alt=""><span>OpenFolio</span><span class="brand-divider">/</span><span id="view-label">共享文档</span></div>
    <div class="top-actions"><button id="focus-reading" class="quiet-button" aria-pressed="false">专注阅读</button><button id="manage" class="primary-button" hidden>分享</button><button id="copy" class="outline-button">复制链接</button></div>
  </header>
  <div id="content">
    <div class="reader-layout">
      <aside class="reader-sidebar" id="reader-sidebar" aria-label="Change 内容导航">
        <div class="change-heading">
          <div class="eyebrow">example / atlas <span class="read-label">只读分享</span></div>
          <h2>订单筛选体验优化</h2>
          <p><span class="status-pill">技术方案</span><span>中型 Change</span></p>
        </div>
        <nav class="detail-tabs" role="tablist" aria-orientation="vertical" aria-label="Change 详情页签">
          <button role="tab" id="tab-documents" aria-controls="detail-panel" data-tab="documents" aria-selected="true">文档 <span>5</span></button>
          <button role="tab" id="tab-overview" aria-controls="detail-panel" data-tab="overview" aria-selected="false" tabindex="-1">概览</button>
          <button role="tab" id="tab-tasks" aria-controls="detail-panel" data-tab="tasks" aria-selected="false" tabindex="-1">任务 <span>3</span></button>
          <button role="tab" id="tab-previews" aria-controls="detail-panel" data-tab="previews" aria-selected="false" tabindex="-1">原型</button>
          <button role="tab" id="tab-integration" aria-controls="detail-panel" data-tab="integration" aria-selected="false" tabindex="-1">合入变更</button>
          <button role="tab" id="tab-evidence" aria-controls="detail-panel" data-tab="evidence" aria-selected="false" tabindex="-1">依据</button>
        </nav>
        <nav class="document-nav" aria-label="Change 文档"></nav>
        <div class="sidebar-footer"><span class="sync-indicator"><i></i><span id="sync-label">自动更新 · 刚刚同步</span></span><button id="refresh" class="quiet-button">↻ 刷新内容</button></div>
      </aside>
      <main class="reading-main" id="reading-main">
        <div class="reader-toolbar"><button id="open-directory" class="quiet-button">☰ 文档目录</button><span id="reading-breadcrumb">文档 / 技术方案</span><button id="font-size" class="quiet-button" aria-label="放大正文字号" aria-pressed="false">Aa</button><button id="open-outline" class="quiet-button">本页目录</button></div>
        <div class="sync-warning" id="sync-warning" role="status" hidden>暂时无法同步，当前显示上次读取的内容。<button id="retry-sync">重试</button></div>
        <section id="detail-panel" role="tabpanel" aria-labelledby="tab-documents" tabindex="-1"></section>
        <footer class="share-footer"><span>内容随 Change 更新</span><span>只读 · OpenFolio</span></footer>
      </main>
      <aside class="page-outline" aria-label="本页目录"><p>本页目录</p><nav class="outline-links"></nav><div class="reading-progress"><span id="reading-progress-label">阅读进度 0%</span><progress id="reading-progress" value="0" max="100" aria-label="阅读进度"></progress></div></aside>
    </div>
  </div>
  <section id="unavailable" class="empty-share" hidden aria-live="polite"></section>
</div>
<dialog id="directory-dialog" class="navigation-dialog" aria-labelledby="directory-title"><div class="dialog-heading"><h2 id="directory-title">文档与 Change 内容</h2><button data-close="directory-dialog" class="quiet-button" aria-label="关闭文档目录">×</button></div><nav id="mobile-directory" aria-label="选择文档或其他内容"></nav></dialog>
<dialog id="outline-dialog" class="navigation-dialog" aria-labelledby="outline-title"><div class="dialog-heading"><h2 id="outline-title">本页目录</h2><button data-close="outline-dialog" class="quiet-button" aria-label="关闭本页目录">×</button></div><nav class="outline-links"></nav></dialog>
<dialog id="share-dialog" aria-labelledby="share-title">
  <div class="dialog-heading"><h2 id="share-title">分享 Change</h2><button id="close-share" class="quiet-button" aria-label="关闭分享设置">×</button></div>
  <p class="dialog-lead">订单筛选体验优化</p>
  <div class="share-scope"><strong>任何获得链接的人都可以查看</strong><p>包含文档、问答、原型和代码合入差异，无需登录。内容随 Change 自动更新。</p></div>
  <div id="share-controls"></div>
</dialog>
<dialog id="copy-dialog" aria-labelledby="copy-title"><h2 id="copy-title">复制分享链接</h2><p>请选中并复制下面的示例链接。</p><input id="copy-value" readonly aria-label="分享链接"><button id="close-copy" class="outline-button">完成</button></dialog>
<div id="notice" role="status" aria-live="polite"></div>
<script>{{include:../shared/change-sharing.js}}</script>
</body>
</html>
