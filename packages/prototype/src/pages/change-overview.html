<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Change 概览 · 原型样例</title><style>{{include:../shared/style.css}}</style></head><body><main class="shell">{{include:../shared/header.html}}
<div class="heading"><div><p class="eyebrow">CHANGE WORKSPACE</p><h1>让每一次改变都有来处。</h1><p class="muted">用同一套设计规范，串联讨论、实现与验收。</p></div><div class="count" aria-label="样例 Change 数量">03</div></div>
<section class="panel" aria-label="样例 Change"><div class="filters"><input id="search" type="search" placeholder="搜索样例 Change" aria-label="搜索样例 Change"><button type="button" data-filter="all" aria-pressed="true">全部</button><button type="button" data-filter="review" aria-pressed="false">验收中</button></div><div class="rows" id="rows"></div><p id="no-results" class="muted" hidden>没有匹配的样例，试试“原型”。</p></section><p class="foot">设计样例 · 搜索与筛选在页面内运行，不读取或修改真实 Change。</p></main>
<script type="module">
const samples=[{title:'Change 原型预览',id:'change-prototype-preview',state:'review',label:'验收中',detail:'共享原型包 · 两个页面与一个组件'}, {title:'Spec 与 Change 工作台',id:'spec-change-workbench',state:'done',label:'已归档',detail:'基于已推送记录的只读视图'}, {title:'小型 Change 自动归档',id:'small-change-auto-archive',state:'done',label:'已归档',detail:'流程由项目 skill 推进'}];
let filter=location.hash==='#review'?'review':'all';
function render(){const query=document.querySelector('#search').value.trim().toLowerCase(); const items=samples.filter(x=>(filter==='all'||x.state===filter)&&[x.title,x.id].join(' ').toLowerCase().includes(query));document.querySelector('#rows').replaceChildren(...items.map(item=>{const row=document.createElement('article');row.className='row';row.innerHTML='<div><h2></h2><p></p></div><span class="tag"></span><small>示例数据</small>';row.querySelector('h2').textContent=item.title;row.querySelector('p').textContent=item.detail;row.querySelector('.tag').textContent=item.label;row.querySelector('.tag').classList.toggle('blue',item.state==='review');return row}));document.querySelector('#no-results').hidden=items.length>0;document.querySelectorAll('[data-filter]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.filter===filter)));}
document.querySelector('#search').addEventListener('input',render);document.querySelectorAll('[data-filter]').forEach(button=>button.onclick=()=>{filter=button.dataset.filter;location.hash=filter;render()});render();
</script></body></html>
