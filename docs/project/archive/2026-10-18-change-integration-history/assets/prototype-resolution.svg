<svg xmlns="http://www.w3.org/2000/svg" width="960" height="760" viewBox="0 0 960 760" role="img" aria-labelledby="prototype-resolution-title prototype-resolution-desc">
<title id="prototype-resolution-title">原型定位：先选择交付版本，再读取产物</title>
<desc id="prototype-resolution-desc">已合入 Change 读取 M 的归档，未合入 Change 固定已推送来源 SHA，旧集中归档缺少定位时留空；Git 与 hosted 使用各自固定产物。</desc>
<defs>
<style>text {font-family:'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Droid Sans Fallback',system-ui,sans-serif;}</style>
<marker id="prototype-resolution-arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker>
<marker id="prototype-resolution-accent" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#3b82f6"/></marker>
</defs>
<rect width="960" height="760" fill="#ffffff"/>
