<text x="680.0" y="626.0" font-size="13" text-anchor="middle" fill="#64748b" font-weight="400">版本、地址、摘要与截图</text>
<text x="48" y="676" font-size="13" text-anchor="start" fill="#475569" font-weight="400">hosted 的 sourceCommit 保持构建源码含义；当前总览继续读取当前清单。</text>
<line x1="40" y1="700" x2="920" y2="700" stroke="#94a3b8" stroke-width="0.8"/>
<text x="40" y="732" font-size="12" text-anchor="start" fill="#64748b" font-weight="400">invalid / unavailable 直接显示诊断，不进入兜底；没有 previews 时显示正常空态。</text>
