<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="change-sources-title change-sources-desc">
  <title id="change-sources-title">集中 Change 入口与独立执行来源</title>
  <desc id="change-sources-desc">主工作区固定在协作分支，原有 change.json 的 branch 定位保存最新状态的工作分支，后台定向读取，执行会话绑定对应独立工作区。</desc>
  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
      .title { font-size: 16px; font-weight: 600; fill: #1e293b; }
      .label { font-size: 12px; font-weight: 600; fill: #1e293b; }
      .secondary { font-size: 10px; fill: #64748b; }
      .body { font-size: 12px; fill: #1e293b; }
    </style>
    <marker id="change-sources-arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="960" height="600" fill="#ffffff"/>
  <text x="40" y="48" class="title">集中发现，目标分支保存最新状态</text>
  <text x="40" y="76" class="body">主工作区固定 develop；独立执行，完成交付默认合回 develop。</text>

  <g fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#change-sources-arrow)">
    <path d="M269 208 H349"/>
    <path d="M605 192 H685"/>
    <path d="M480 379 V299"/>
    <path d="M355 424 H275"/>
    <path d="M605 424 H636 Q644 424 644 416 V232 Q644 224 652 224 H685"/>
    <path d="M796 261 V373"/>
  </g>
  <rect x="280" y="184" width="64" height="14" rx="2" fill="#ffffff"/>
  <text x="312" y="195" class="secondary" text-anchor="middle">讨论 / 查找</text>
  <rect x="608" y="168" width="80" height="14" rx="2" fill="#ffffff"/>
  <text x="648" y="179" class="secondary" text-anchor="middle">branch 指向</text>
  <rect x="488" y="328" width="72" height="14" rx="2" fill="#ffffff"/>
  <text x="492" y="339" class="secondary">先读集中目录</text>
  <rect x="272" y="400" width="80" height="14" rx="2" fill="#ffffff"/>
  <text x="312" y="411" class="secondary" text-anchor="middle">读取入口配置</text>
  <rect x="652" y="300" width="60" height="14" rx="2" fill="#ffffff"/>
  <text x="656" y="311" class="secondary">定向读取</text>
  <rect x="804" y="324" width="80" height="14" rx="2" fill="#ffffff"/>
  <text x="808" y="335" class="secondary">定位 / 检出</text>

  <rect x="64" y="160" width="200" height="96" rx="6" fill="#ffffff"/>
  <rect x="64" y="160" width="200" height="96" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <rect x="76" y="172" width="44" height="16" rx="2" fill="#f8fafc"/>
  <text x="98" y="184" class="secondary" text-anchor="middle">本机</text>
  <text x="80" y="212" class="label">主工作区 / 讨论会话</text>
  <text x="80" y="236" class="secondary">固定检出 develop，不直接实现</text>

  <rect x="360" y="128" width="240" height="160" rx="6" fill="#ffffff"/>
  <rect x="360" y="128" width="240" height="160" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <rect x="372" y="140" width="44" height="16" rx="2" fill="#ffffff"/>
  <text x="394" y="152" class="secondary" text-anchor="middle">Git</text>
  <text x="376" y="180" class="label">develop · 讨论与预发布</text>
  <text x="376" y="208" class="body">保留 change.json 与原正文</text>
  <text x="376" y="236" class="body">branch 定位当前所属分支</text>
  <text x="376" y="264" class="secondary">集成代码、Specs 与完成归档</text>

  <rect x="696" y="160" width="200" height="96" rx="6" fill="#ffffff"/>
  <rect x="696" y="160" width="200" height="96" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <rect x="708" y="172" width="44" height="16" rx="2" fill="#ffffff"/>
  <text x="730" y="184" class="secondary" text-anchor="middle">Git</text>
  <text x="712" y="212" class="label">Change 工作分支</text>
  <text x="712" y="236" class="secondary">完整状态、正文与执行代码</text>

  <rect x="64" y="384" width="200" height="80" rx="6" fill="#ffffff"/>
  <rect x="64" y="384" width="200" height="80" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="80" y="416" class="label">保护分支 · main</text>
  <text x="80" y="440" class="secondary">用户主动要求后合入或创建 PR</text>

  <rect x="360" y="384" width="240" height="80" rx="6" fill="#ffffff"/>
  <rect x="360" y="384" width="240" height="80" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="376" y="416" class="label">OpenFolio 后台</text>
  <text x="376" y="440" class="secondary">按登记来源读取已推送提交</text>

  <rect x="696" y="384" width="200" height="80" rx="6" fill="#ffffff"/>
  <rect x="696" y="384" width="200" height="80" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="712" y="416" class="label">独立 worktree</text>
  <text x="712" y="440" class="secondary">执行会话核验绑定后写入</text>

  <text x="64" y="512" class="body">入口复用 change.json.branch；工作台只读协作来源，旧全量扫描下线。</text>
  <line x1="40" y1="540" x2="920" y2="540" stroke="#94a3b8" stroke-width="0.8"/>
  <text x="40" y="568" class="secondary">箭头表示定位或读取方向；正文另述移交顺序、恢复与历史来源。</text>
</svg>
