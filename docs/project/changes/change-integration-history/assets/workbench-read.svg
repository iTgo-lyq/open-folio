<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="workbench-read-title workbench-read-desc">
<title id="workbench-read-title">工作台读取：同一快照边界连接索引与 diff</title>
<desc id="workbench-read-desc">GitReader 从固定协作提交生成合入索引，授权后的读取请求使用快照中固定的 M 与 B 返回整体差异，不依赖原始工作分支。</desc>
<defs>
<style>text {font-family:'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Droid Sans Fallback',system-ui,sans-serif;}</style>
<marker id="workbench-read-arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker>
<marker id="workbench-read-accent" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#3b82f6"/></marker>
</defs>
<rect width="960" height="600" fill="#ffffff"/>
<text x="40" y="48" font-size="20" text-anchor="start" fill="#1e293b" font-weight="600">工作台读取：同一快照边界连接索引与 diff</text>
<text x="40" y="76" font-size="13" text-anchor="start" fill="#64748b" font-weight="400">图中聚焦合入记录与差异读取；活动 Change 的已有定向读取继续保留。</text>
