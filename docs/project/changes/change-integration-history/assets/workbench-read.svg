<text x="788.0" y="416" font-size="13" text-anchor="middle" fill="#64748b" font-weight="400">只读差异 / 空态 / 诊断</text>
<text x="64" y="484" font-size="14" text-anchor="start" fill="#475569" font-weight="400">文档与合入索引使用同一协作 tip；缓存可重建，不回写 change.json。</text>
<line x1="40" y1="540" x2="920" y2="540" stroke="#94a3b8" stroke-width="0.8"/>
<text x="40" y="572" font-size="12" text-anchor="start" fill="#64748b" font-weight="400">上行：刷新并生成派生索引　　下行：通过现有仓库授权读取固定差异</text>
