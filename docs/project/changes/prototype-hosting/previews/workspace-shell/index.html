<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>OpenFolio · 页面外壳</title><style>/* Snapshot of the current shell. Sources and scope: ../../DESIGN.md. */
:root {
  --of-ink: #2e3c46;
  --of-muted: #7a8995;
  --of-line: #e9edf0;
  --of-blue: #285d80;
  --of-blue-soft: #edf5fb;
  --of-green: #548673;
  --of-orange: #b48b49;
  --of-red: #ae655e;
  --of-surface: #f8fbfd;
  --of-focus: #749ebb;
  --of-radius: 7px;
  --of-space: 4px;
  --of-font:
    Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
    "Microsoft YaHei", sans-serif;
}
:root {
  --ink: var(--of-ink);
  --muted: var(--of-muted);
  --line: var(--of-line);
  --blue: var(--of-blue);
  --blue-soft: var(--of-blue-soft);
  --green: var(--of-green);
  --orange: var(--of-orange);
  --red: var(--of-red);
  font-family: var(--of-font);
  color: var(--ink);
  background: #f0f5f9;
  font-synthesis: none;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  font-size: 13px;
}
button,
input,
select,
textarea {
  font: inherit;
}
button,
a,
input,
select {
  -webkit-tap-highlight-color: transparent;
}
button {
  cursor: pointer;
  color: inherit;
  background: none;
  border: 0;
}
button:disabled {
  cursor: wait;
  opacity: 0.48;
}
a {
  color: var(--blue);
  text-decoration: none;
}
button:focus-visible,
a:focus-visible,
select:focus-visible,
input:focus-visible {
  outline: 2px solid #749ebb;
  outline-offset: 3px;
}
svg {
  flex-shrink: 0;
}
button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
}
h1,
h2,
h3,
p {
  margin-top: 0;
}
code,
kbd,
pre {
  font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
}
select {
  max-width: 100%;
  background: transparent;
  color: inherit;
  border: 0;
  cursor: pointer;
}
input {
  min-width: 0;
  color: inherit;
}
::selection {
  background: #d4e7f5;
}
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}
.app-shell {
  height: 100dvh;
  display: grid;
  grid-template-columns: 84px minmax(0, 1fr);
  padding: 12px 12px 12px 0;
  background:
    radial-gradient(ellipse at 0% 12%, #eaf5fb, transparent 62%),
    radial-gradient(ellipse at 18% 100%, #f4f0fb, transparent 60%),
    radial-gradient(ellipse at 100% 0%, #fbfbff, transparent 54%), #f8fafc;
  transition: grid-template-columns 0.2s;
}
.module-rail {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}
.shell-brand {
  position: absolute;
  top: 8px;
  left: 20px;
  width: 44px;
  height: 44px;
  border-radius: 14px;
  padding: 0;
}
.shell-brand img {
  width: 44px;
  height: 44px;
  object-fit: contain;
}
.shell-brand:hover {
  background: #ffffff60;
}
.module-nav {
  padding: 7px;
  width: 60px;
  border: 1px solid #ffffffaa;
  border-radius: 34px;
  background: #f7fbff66;
  backdrop-filter: blur(20px) saturate(135%);
  box-shadow:
    0 8px 24px #354b6012,
    0 2px 6px #354b6008,
    inset 0 1px 1px #ffffffe6,
    inset 0 -1px 2px #7186981a;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.module-nav a {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 44px;
  height: 44px;
  color: #7e95a8;
  border-radius: 50%;
  transition:
    background 0.15s,
    color 0.15s;
}
.module-nav a[aria-current] {
  background: #ffffffae;
  color: #355e7f;
  box-shadow: 0 1px 6px #354b6009;
}
.module-nav a:hover {
  background: #ffffff75;
  color: #355e7f;
}
.module-nav a span {
  white-space: nowrap;
  position: absolute;
  left: 54px;
  padding: 6px 10px;
  background: #365975;
  color: white;
  border-radius: 6px;
  font-size: 11px;
  opacity: 0;
  pointer-events: none;
  z-index: 20;
}
.module-nav a:hover span,
.module-nav a:focus-visible span {
  opacity: 1;
}
.rail-footer {
  position: absolute;
  bottom: 12px;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: linear-gradient(145deg, #e6eff8, #cedeed);
  border: 2px solid #fff;
  box-shadow: 0 2px 7px #4068761a;
  display: grid;
  place-items: center;
  color: #456681;
  font-size: 11px;
}
.settings-mobile-trigger {
  display: none;
}
.rail-collapsed .settings-mobile-trigger,
.preview-focused .settings-mobile-trigger {
  display: inline-flex;
}
.rail-collapsed {
  grid-template-columns: 12px minmax(0, 1fr);
}
.rail-collapsed .module-nav,
.rail-collapsed .rail-footer,
.rail-collapsed .shell-brand img {
  display: none;
}
.rail-collapsed .shell-brand {
  left: 0;
  top: 45%;
  width: 12px;
  height: 50px;
}
.rail-collapsed .restore-handle {
  display: block;
  width: 2px;
  height: 28px;
  border-radius: 3px;
  background: #92a8bb;
}
.workspace {
  min-width: 0;
  min-height: 0;
  border-radius: 16px;
  background: #fff;
  border: 1px solid #fff;
  box-shadow: 0 4px 24px #34567606;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.workspace-header {
  height: 64px;
  flex-shrink: 0;
  padding: 0 25px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--line);
  gap: 16px;
}
.header-context,
.header-actions,
.row {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
}
.project-select {
  display: flex;
  align-items: center;
  gap: 9px;
  min-width: 0;
}
.project-select select {
  font-weight: 600;
  font-size: 13px;
  max-width: 220px;
  padding: 5px 2px;
}
.project-monogram {
  width: 25px;
  height: 25px;
  border: 1px solid #e4ecf3;
  border-radius: 7px;
  background: #f1f6fb;
  display: grid;
  place-items: center;
  color: #57738e;
  font-size: 12px;
  font-weight: 600;
  flex-shrink: 0;
}
.header-chevron {
  color: #bac4cb;
}
.header-module {
  font-weight: 600;
}
.read-only {
  font-size: 10px;
  color: #8796a2;
  background: #f5f7f9;
  padding: 3px 6px;
  border-radius: 4px;
  letter-spacing: 0.03em;
}
.search-launch {
  color: #93a0ab;
  border: 1px solid #eef1f4;
  border-radius: 7px;
  height: 32px;
  padding: 0 9px;
  font-size: 11px;
  gap: 9px;
}
.search-launch kbd {
  font-size: 10px;
  color: #a0aab3;
  border-left: 1px solid var(--line);
  padding-left: 7px;
}
.icon-button {
  width: 30px;
  height: 30px;
  border-radius: 6px;
  flex-shrink: 0;
  color: #8192a0;
  padding: 4px;
}
.icon-button:hover {
  background: #f0f5f9;
  color: #355e7f;
}
.workspace-source {
  height: 39px;
  flex-shrink: 0;
  padding: 0 26px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  color: #8997a2;
  font-size: 11px;
  border-bottom: 1px solid #eff2f4;
  gap: 10px;
}
.workspace-source .row {
  gap: 7px;
}
.workspace-source select {
  font-size: 11px;
  max-width: 320px;
}
.source-separator {
  color: #c1cbd3;
  padding: 0 7px;
}
.snapshot-time {
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.icon-sprite { position:absolute; width:0; height:0; overflow:hidden; }
.icon { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.header-actions .icon,.workspace-source .icon { width:16px; height:16px; }
.header-chevron { width:14px; height:14px; }
.rail-footer .icon { width:18px; height:18px; }
.shell-content { flex:1; min-height:0; overflow:auto; display:grid; place-items:center; }
.content-outline { color:var(--muted); text-align:center; }
.content-outline h1 { font-size:14px; font-weight:400; margin:0 0 8px; color:var(--muted); }
.content-outline p { font-size:11px; color:#8997a2; margin:0; }
.mobile-navigation { display:none; }
.feedback { position:fixed; left:50%; bottom:30px; transform:translateX(-50%); border:1px solid var(--line); border-radius:8px; padding:10px 16px; background:white; box-shadow:0 4px 24px #34567612; color:var(--ink); font-size:12px; max-width:calc(100% - 32px); text-align:center; }
.feedback:empty { display:none; }
.quick-search { width:min(480px,calc(100vw - 32px)); padding:20px; border:1px solid var(--line); border-radius:14px; color:var(--ink); box-shadow:0 16px 64px #34567625; }
.quick-search::backdrop { background:#2e3c4633; }
.dialog-heading { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
.dialog-heading h2 { font-size:15px; margin:0; }
.quick-search input { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:7px; background:var(--of-surface); margin-bottom:12px; }
.quick-search ul { list-style:none; margin:0; padding:0; }
.quick-search li button { width:100%; justify-content:flex-start; padding:12px; border-radius:7px; }
.quick-search li button:hover { background:var(--blue-soft); }
.quick-search p { font-size:12px; color:var(--muted); margin:12px; }
[hidden] { display:none!important; }
@media(max-width:1180px) { .search-launch span,.search-launch kbd { display:none; } }
@media(max-width:760px) {
 .app-shell,.app-shell.rail-collapsed { display:flex; padding:9px 9px 78px; }
 .module-rail { display:none; }
 .workspace { width:100%; border-radius:13px; }
 .workspace-header { height:58px; padding:0 14px; gap:8px; }
 .header-context { gap:8px; flex:1; }
 .project-select { gap:6px; }
 .project-select select { max-width:125px; font-size:12px; }
 .project-monogram { width:22px; height:22px; font-size:11px; }
 .header-module { font-size:12px; }
 .read-only { display:none; }
 .header-actions { gap:3px; }
 .settings-mobile-trigger { display:inline-flex; }
 .search-launch { border:0; padding:5px; width:28px; }
 .header-chevron { width:10px; }
 .workspace-source { height:37px; padding:0 14px; font-size:10px; }
 .workspace-source select { max-width:200px; font-size:10px; }
 .snapshot-time { font-size:9px; }
 .mobile-navigation { display:block; position:fixed; bottom:15px; left:50%; transform:translateX(-50%); z-index:20; }
 .mobile-navigation .module-nav { width:auto; padding:5px; flex-direction:row; border-radius:32px; background:#ffffff80; gap:4px; }
 .mobile-navigation .module-nav a { width:min(102px,calc((100vw - 40px)/3)); height:43px; border-radius:25px; gap:7px; font-size:11px; }
 .mobile-navigation .module-nav a span { position:static; opacity:1; display:inline; padding:0; background:none; color:inherit; font-size:11px; }
 .mobile-navigation .module-nav a svg { width:16px; height:16px; }
 .mobile-navigation .module-nav a[aria-current] { background:#fff; color:#355e7f; }
 .feedback { bottom:88px; }
}
@media(max-width:360px) {
 .project-select select { max-width:96px; }
 .header-module { font-size:11px; }
 .workspace-header { padding:0 10px; }
 .header-context { gap:5px; }
 .workspace-source { padding:0 10px; }
 .snapshot-time { display:none; }
}
@media(prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto!important; animation:none!important; transition:none!important; } }

</div>

</dialog>
<script>
const $ = (selector) => document.querySelector(selector);
const labels = { specs: 'Specs', changes: 'Changes', prototypes: '原型' };
const sources = { specs: 'main · 守护分支', changes: '全部已推送分支 / 各 Change 主来源', prototypes: 'main / 当前页面' };
document.querySelectorAll('[data-navigation]').forEach(target => target.append($('#module-navigation').content.cloneNode(true)));
function render() {
 const id = Object.hasOwn(labels, location.hash.slice(1)) ? location.hash.slice(1) : 'specs';
 $('.header-module').textContent = labels[id];
 $('#canvas-title').textContent = labels[id] + ' 内容区';
 $('#source').textContent = sources[id];
 document.querySelectorAll('[data-module]').forEach(link => {
  if (link.dataset.module === id) link.setAttribute('aria-current', 'page');
  else link.removeAttribute('aria-current');
 });
}
window.addEventListener('hashchange', render);
render();
$('.shell-brand').onclick = () => {
 const closed = $('.app-shell').classList.toggle('rail-collapsed');
 $('.shell-brand').setAttribute('aria-label', closed ? '展开侧栏' : '收起侧栏');
 $('.shell-brand').setAttribute('aria-expanded', String(!closed));
};
let feedbackTimer;
function feedback(text) {
 clearTimeout(feedbackTimer);
 $('.feedback').textContent = text;
 feedbackTimer = setTimeout(() => $('.feedback').textContent = '', 2400);
}
document.querySelectorAll('[data-settings]').forEach(button => button.onclick = () => feedback('工作台配置入口 · 当前为外壳预览'));
$('#refresh').onclick = () => feedback('当前为页面外壳预览');
const dialog = $('.quick-search');
let trigger;
function openSearch() {
 if (dialog.open) return;
 trigger = document.activeElement;
 $('#search-input').value = '';
 filter();
 dialog.showModal();
 $('#search-input').focus();
}
$('.search-launch').onclick = openSearch;
dialog.querySelector('[aria-label="关闭搜索"]').onclick = () => dialog.close();
dialog.addEventListener('close', () => trigger?.focus());
dialog.querySelectorAll('[data-target]').forEach(button => button.onclick = () => {
 location.hash = button.dataset.target;
 render();
 dialog.close();
});
function filter() {
 const query = $('#search-input').value.trim().toLowerCase();
 let count = 0;
 dialog.querySelectorAll('li').forEach(item => {
  item.hidden = !item.textContent.toLowerCase().includes(query);
  if (!item.hidden) count++;
 });
 $('#no-results').hidden = count > 0;
}
$('#search-input').addEventListener('input', filter);
window.addEventListener('keydown', event => {
 if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'k') {
  event.preventDefault();
  if (dialog.open) dialog.close(); else openSearch();
 }
});
</script>
