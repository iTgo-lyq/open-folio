<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="update-check-flow-title update-check-flow-desc">
  <title id="update-check-flow-title">change.mjs 更新检查流程</title>
  <desc id="update-check-flow-desc">状态操作成功后先释放锁，关闭检查时原样输出，开启时读取安装版本和缓存，必要时请求公开版本，最后按比较结果追加提示。</desc>
  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
      .title { font-size: 16px; font-weight: 600; fill: #1e293b; }
      .name { font-size: 12px; font-weight: 600; text-anchor: middle; }
      .secondary { font-size: 10px; fill: #64748b; }
      .edge { fill: none; stroke: #64748b; stroke-width: 1.2; marker-end: url(#update-check-flow-arrow); }
    </style>
    <marker id="update-check-flow-arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="960" height="600" fill="#ffffff"/>
  <text x="480" y="40" text-anchor="middle" class="title">成功状态操作之后，顺带检查已发布版本</text>
  <g aria-hidden="true">
    <path class="edge" d="M480 109 V113"/>
    <path class="edge" d="M480 201 V213"/>
    <path class="edge" d="M581 160 H685"/>
    <path class="edge" d="M796 189 V201"/>
    <path class="edge" d="M695 248 H636 Q628 248 628 256 V352 Q628 360 620 360 H591"/>
    <path class="edge" d="M796 289 V317"/>
    <path class="edge" d="M691 352 H656 Q648 352 648 360 V368 Q648 376 640 376 H591"/>
    <path class="edge" d="M480 397 V425"/>
  </g>
  <rect x="492" y="200" width="36" height="16" fill="#ffffff"/>
  <text x="496" y="212" class="secondary">关闭</text>
  <rect x="616" y="136" width="36" height="16" fill="#ffffff"/>
  <text x="620" y="148" class="secondary">开启</text>
  <rect x="640" y="222" width="44" height="16" fill="#ffffff"/>
  <text x="644" y="234" class="secondary">有效</text>
  <rect x="808" y="292" width="76" height="20" fill="#ffffff"/>
  <text x="812" y="305" class="secondary">无 / 已过期</text>
  <rect x="380" y="64" width="200" height="40" rx="20" fill="#dbeafe" stroke="#1e40af"/>
  <text x="480" y="88" class="name" fill="#1e40af">操作成功并释放状态锁</text>
  <path d="M480 124 L576 160 L480 196 L384 160 Z" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="480" y="164" class="name" fill="#b45309">项目开启检查？</text>
  <rect x="380" y="224" width="200" height="48" rx="20" fill="#d1fae5" stroke="#166534"/>
  <text x="480" y="252" class="name" fill="#166534">原样输出 JSON</text>
  <rect x="696" y="136" width="200" height="48" rx="6" fill="#fef3c7" stroke="#b45309"/>
  <text x="796" y="156" class="name" fill="#b45309">读取安装版本与缓存</text>
  <text x="796" y="173" text-anchor="middle" font-size="10" fill="#b45309">版本缺失时返回 unknown</text>
  <path d="M796 212 L892 248 L796 284 L700 248 Z" fill="#fef3c7" stroke="#b45309"/>
  <text x="796" y="252" class="name" fill="#b45309">缓存仍有效？</text>
  <rect x="696" y="328" width="200" height="48" rx="6" fill="#fef3c7" stroke="#b45309"/>
  <text x="796" y="348" class="name" fill="#b45309">请求公开版本并保存缓存</text>
  <text x="796" y="365" text-anchor="middle" font-size="10" fill="#b45309">最长等待 3 秒</text>
  <rect x="380" y="344" width="200" height="48" rx="6" fill="#fef3c7" stroke="#b45309"/>
  <text x="480" y="364" class="name" fill="#b45309">比较版本或标记未知</text>
  <text x="480" y="381" text-anchor="middle" font-size="10" fill="#b45309">不改变状态操作的退出码</text>
  <rect x="380" y="436" width="200" height="64" rx="20" fill="#d1fae5" stroke="#166534" stroke-width="2"/>
  <text x="480" y="462" class="name" fill="#166534">输出原结果与可选提示</text>
  <text x="480" y="481" text-anchor="middle" font-size="10" fill="#166534">有新版或未知时追加 skillUpdate</text>
  <text x="64" y="316" class="secondary">开关取自目标项目的 workflow.json。</text>
  <text x="64" y="336" class="secondary">检查失败与缓存失败都不影响状态写入。</text>
  <line x1="40" y1="540" x2="920" y2="540" stroke="#94a3b8" stroke-width="0.8"/>
  <rect x="64" y="560" width="24" height="12" rx="6" fill="#dbeafe" stroke="#1e40af"/>
  <text x="100" y="570" class="secondary">输入 / 起点</text>
  <path d="M264 560 L276 566 L264 572 L252 566 Z" fill="#fef3c7" stroke="#b45309"/>
  <text x="288" y="570" class="secondary">判断</text>
  <rect x="428" y="560" width="24" height="12" rx="2" fill="#fef3c7" stroke="#b45309"/>
  <text x="464" y="570" class="secondary">处理</text>
  <rect x="600" y="560" width="24" height="12" rx="6" fill="#d1fae5" stroke="#166534"/>
  <text x="636" y="570" class="secondary">输出</text>
</svg>
