<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">图表标题</title>
  <desc id="diagram-desc">输入经过处理后形成输出。</desc>
  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
      .title { font-size: 16px; font-weight: 600; fill: #1e293b; }
      .label { font-size: 12px; font-weight: 600; }
      .secondary { font-size: 10px; fill: #64748b; }
    </style>
    <marker id="diagram-arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="960" height="320" fill="#ffffff"/>
  <text x="480" y="48" text-anchor="middle" class="title">图表标题</text>
  <!-- Replace the example content and use unique diagram-prefixed IDs. -->
  <path d="M285 160 H369" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#diagram-arrow)"/>
  <path d="M585 160 H669" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#diagram-arrow)"/>
  <rect x="80" y="120" width="200" height="80" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="180" y="164" text-anchor="middle" class="label" fill="#1e40af">输入</text>
  <rect x="380" y="120" width="200" height="80" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="480" y="164" text-anchor="middle" class="label" fill="#b45309">处理</text>
  <rect x="680" y="120" width="200" height="80" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="780" y="164" text-anchor="middle" class="label" fill="#166534">输出</text>
  <text x="80" y="268" class="secondary">按内容调整节点、关系与说明。</text>
</svg>
